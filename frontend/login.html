<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — FlavorBase</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="site-header">
        <div class="logo">FlavorBase</div>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main class="auth-page">
        <form id="login-form" class="auth-form">
            <h1>Login</h1>

            <p class="error-message" id="login-error"></p>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Login</button>

            <p class="auth-switch">Don't have an account? <a href="register.html">Register here</a></p>
        </form>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 FlavorBase. Built while learning full-stack development.</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
